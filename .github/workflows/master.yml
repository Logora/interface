name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: master-workflow
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  deploy-storybook:
    name: Deploy Storybook to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Storybook artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./storybook-static

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The "master" ruleset requires every change to land through a pull request
      # ("GH013: Changes must be made through a pull request"), so this job can no
      # longer commit the version bump and push it back to master. The version to
      # publish is therefore derived from the registry and only written to the
      # package.json of the runner.
      - name: Compute the version to publish
        id: version
        run: |
          LATEST=$(npm view @logora/debate version 2>/dev/null || echo "0.0.0")
          node - "$LATEST" <<'JS' >> "$GITHUB_OUTPUT"
          const fs = require("node:fs");

          const latest = process.argv[2];
          const current = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
          const parse = (version) => version.split(".").map((part) => Number.parseInt(part, 10));
          const isGreater = (left, right) => {
            const [a, b] = [parse(left), parse(right)];
            for (let i = 0; i < 3; i += 1) {
              if (a[i] !== b[i]) return a[i] > b[i];
            }
            return false;
          };

          if (isGreater(current, latest)) {
            // A minor/major version bumped by hand in a pull request wins.
            console.log(`version=${current}`);
          } else {
            const [major, minor, patch] = parse(latest);
            console.log(`version=${major}.${minor}.${patch + 1}`);
          }
          JS

      - name: Set the version in package.json
        run: npm pkg set "version=${{ steps.version.outputs.version }}"

      # --no-git-checks: the version is set in the working tree but not committed,
      # since pushing a bump commit to master is not allowed anymore.
      - name: Publish to npm
        run: pnpm publish --provenance --access public --no-git-checks
